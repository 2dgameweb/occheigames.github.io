function dampAngle(a,b,l,dt){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*(1-Math.exp(-l*dt))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

const particles=[];
function spawnParticles(x,y,z,color,count){
 count=count||8;
 for(let i=0;i<count;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.06,4,4),new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:1}));
  m.position.set(x,y,z);
  m.userData.vel=new THREE.Vector3(rand(-2,2),rand(2,5),rand(-2,2));
  m.userData.life=1;
  scene.add(m);particles.push(m);
 }
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.userData.life-=dt*2;
  if(p.userData.life<=0){scene.remove(p);particles.splice(i,1);continue}
  p.userData.vel.y-=12*dt;
  p.position.addScaledVector(p.userData.vel,dt);
  p.material.opacity=p.userData.life;
 }
}

const SFX={ctx:null,master:null,
 init(){if(this.ctx){try{this.ctx.resume()}catch(e){}return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=settings.volume;this.master.connect(this.ctx.destination)},
 setVol(v){settings.volume=v;if(this.master)this.master.gain.value=v},
 tone(f,d,type,vol,slide){type=type||'sine';vol=vol||.2;if(!this.ctx)return;
  const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03)},
 noise(d,vol,freq){vol=vol||.3;freq=freq||900;if(!this.ctx)return;
  const t=this.ctx.currentTime,len=Math.max(1,(this.ctx.sampleRate*d)|0),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=this.ctx.createBufferSource();src.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(f);f.connect(g);g.connect(this.master);src.start()},
 jump(){this.tone(180,.18,'sine',.22,430)},
 land(){this.noise(.08,.12,500)},
 trip(){this.noise(.2,.25,700);this.tone(120,.22,'sawtooth',.12,65)},
 hit(){this.noise(.24,.4,650);this.tone(92,.28,'sawtooth',.24,42)},
 sprint(){this.tone(220,.12,'triangle',.12,340)},
 click(){this.tone(520,.07,'triangle',.1,700)},
 vault(){this.tone(300,.15,'sine',.15,600)},
 mud(){this.noise(.15,.15,300)},
 win(){const notes=[523,659,784,1046];for(let i=0;i<notes.length;i++){const self=this;setTimeout(function(){self.tone(notes[i],.24,'triangle',.24)},i*115)}},
 lose(){const notes=[220,174,130,87];for(let i=0;i<notes.length;i++){const self=this;setTimeout(function(){self.tone(notes[i],.34,'sawtooth',.18)},i*175)}},
 moo(dist,aggressive){
  if(!this.ctx)return;
  const v=clamp(1-dist/36,0,1)*(aggressive?.45:.3);
  if(v<.01)return;
  const t=this.ctx.currentTime,o1=this.ctx.createOscillator(),o2=this.ctx.createOscillator(),g=this.ctx.createGain();
  o1.type='sawtooth';o2.type='triangle';
  const baseF=aggressive?150:120, endF=aggressive?100:82;
  o1.frequency.setValueAtTime(baseF,t);o1.frequency.linearRampToValueAtTime(endF,t+.52);
  o2.frequency.setValueAtTime(baseF*1.5,t);o2.frequency.linearRampToValueAtTime(endF*1.44,t+.52);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+.68);
  o1.connect(g);o2.connect(g);g.connect(this.master);
  o1.start(t);o2.start(t);o1.stop(t+.72);o2.stop(t+.72);
 }
};

function generateMaze(size,lvl){
 const g=[];
 for(let y=0;y<size;y++){g[y]=[];for(let x=0;x<size;x++)g[y][x]=true}
 g[1][1]=false;
 const stack=[[1,1]],dirs=[[0,-2],[0,2],[-2,0],[2,0]];
 while(stack.length){
  const cur=stack[stack.length-1],x=cur[0],y=cur[1],opts=[];
  for(let i=0;i<dirs.length;i++){const dx=dirs[i][0],dy=dirs[i][1],nx=x+dx,ny=y+dy;
   if(nx>0&&ny>0&&nx<size-1&&ny<size-1&&g[ny][nx])opts.push([dx,dy])}
  if(!opts.length){stack.pop();continue}
  const pick=opts[(Math.random()*opts.length)|0],dx=pick[0],dy=pick[1];
  g[y+dy/2][x+dx/2]=false;g[y+dy][x+dx]=false;stack.push([x+dx,y+dy]);
 }
 const openness=Math.min(.34,.20+lvl*.02);
 for(let y=1;y<size-1;y++)for(let x=1;x<size-1;x++){
  if(g[y][x]&&Math.random()<openness){
   let o=0;if(!g[y-1][x])o++;if(!g[y+1][x])o++;if(!g[y][x-1])o++;if(!g[y][x+1])o++;
   if(o>=2)g[y][x]=false;
  }
 }
 const clearings=5+Math.min(lvl,6);
 for(let i=0;i<clearings;i++){
  const cx=2+((Math.random()*(size-5))|0),cz=2+((Math.random()*(size-5))|0);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   const nx=cx+dx,nz=cz+dy;
   if(nx>0&&nz>0&&nx<size-1&&nz<size-1)g[nz][nx]=false;
  }
 }
 g[1][1]=false;
 return g;
}
function cellCenter(cx,cz){return{x:offsetX+cx*CELL,z:offsetZ+cz*CELL}}
function isOpenCell(cx,cz){return cx>=0&&cz>=0&&cx<MAZE_SIZE&&cz<MAZE_SIZE&&maze[cz]&&!maze[cz][cx]}
function nearestOpenCell(cx,cz){
 if(isOpenCell(cx,cz))return{x:cx,z:cz};
 for(let r=1;r<=6;r++)for(let y=cz-r;y<=cz+r;y++)for(let x=cx-r;x<=cx+r;x++){
  if(Math.max(Math.abs(x-cx),Math.abs(y-cz))===r&&isOpenCell(x,y))return{x:x,z:y}
 }
 return null;
}
function findPath(sx,sz,tx,tz){
 const s0=nearestOpenCell(Math.round((sx-offsetX)/CELL),Math.round((sz-offsetZ)/CELL));
 const t0=nearestOpenCell(Math.round((tx-offsetX)/CELL),Math.round((tz-offsetZ)/CELL));
 if(!s0||!t0)return[];
 const N=MAZE_SIZE*MAZE_SIZE,prev=new Int32Array(N).fill(-1),seen=new Uint8Array(N);
 const queue=[s0.z*MAZE_SIZE+s0.x];seen[queue[0]]=1;
 const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 let found=false;
 while(queue.length){
  const idx=queue.shift(),x=idx%MAZE_SIZE,z=(idx/MAZE_SIZE)|0;
  if(x===t0.x&&z===t0.z){found=true;break}
  for(let i=0;i<dirs.length;i++){
   const nx=x+dirs[i][0],nz=z+dirs[i][1];
   if(!isOpenCell(nx,nz))continue;
   const ni=nz*MAZE_SIZE+nx;
   if(seen[ni])continue;
   seen[ni]=1;prev[ni]=idx;queue.push(ni);
  }
 }
 if(!found)return[];
 const path=[];let idx=t0.z*MAZE_SIZE+t0.x;
 while(idx!==-1){const x=idx%MAZE_SIZE,z=(idx/MAZE_SIZE)|0;path.unshift(cellCenter(x,z));idx=prev[idx]}
 if(path.length)path.shift();
 return path;
}
function simplifyPath(p){
 if(p.length<3)return p;
 const out=[p[0]];
 for(let i=1;i<p.length-1;i++){
  const a=p[i-1],b=p[i],c=p[i+1];
  if(Math.abs((b.x-a.x)-(c.x-b.x))>.01||Math.abs((b.z-a.z)-(c.z-b.z))>.01)out.push(b);
 }
 out.push(p[p.length-1]);
 return out;
}

// ============ CATMULL-ROM con lunghezze cumulative per movimento uniforme ============
function catmullRom(p0,p1,p2,p3,t){
 const t2=t*t,t3=t2*t;
 return{
  x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
  z:.5*((2*p1.z)+(-p0.z+p2.z)*t+(2*p0.z-5*p1.z+4*p2.z-p3.z)*t2+(-p0.z+3*p1.z-3*p2.z+p3.z)*t3)
 };
}

// Costruisce un path denso di punti uniformemente spaziati (circa SAMPLE_STEP metri l'uno dall'altro)
// con lunghezze cumulative per interpolazione precisa
const SAMPLE_STEP = 0.35;
function buildDensePath(waypoints){
 if(waypoints.length<2)return{points:waypoints.slice(),cumLen:[0],totalLen:0};
 // Duplica primo e ultimo per Catmull-Rom
 const pts=[waypoints[0]].concat(waypoints).concat([waypoints[waypoints.length-1]]);
 const dense=[];
 const nSegs=waypoints.length-1;
 for(let s=0;s<nSegs;s++){
  const p0=pts[s],p1=pts[s+1],p2=pts[s+2],p3=pts[s+3];
  // Campiona finemente il segmento
  const steps=PATH_SAMPLES_PER_SEGMENT;
  for(let i=0;i<steps;i++){
   const t=i/steps;
   dense.push(catmullRom(p0,p1,p2,p3,t));
  }
 }
 dense.push(waypoints[waypoints.length-1]);

 // Calcola lunghezze cumulative
 const cumLen=[0];
 for(let i=1;i<dense.length;i++){
  const dx=dense[i].x-dense[i-1].x, dz=dense[i].z-dense[i-1].z;
  cumLen.push(cumLen[i-1]+Math.hypot(dx,dz));
 }

 // Ricampiona a spaziatura uniforme per movimento costante
 const total=cumLen[cumLen.length-1];
 if(total<0.01)return{points:dense,cumLen:cumLen,totalLen:total};

 const uniform=[];
 const nPoints=Math.max(2,Math.ceil(total/SAMPLE_STEP));
 for(let i=0;i<=nPoints;i++){
  const targetDist=(i/nPoints)*total;
  // binary search
  let lo=0,hi=cumLen.length-1;
  while(lo<hi-1){
   const mid=(lo+hi)>>1;
   if(cumLen[mid]<targetDist)lo=mid;else hi=mid;
  }
  const segLen=cumLen[hi]-cumLen[lo];
  const t=segLen>1e-6?(targetDist-cumLen[lo])/segLen:0;
  uniform.push({
   x:dense[lo].x+(dense[hi].x-dense[lo].x)*t,
   z:dense[lo].z+(dense[hi].z-dense[lo].z)*t
  });
 }

 // Ricalcola cumLen per uniform
 const uCum=[0];
 for(let i=1;i<uniform.length;i++){
  const dx=uniform[i].x-uniform[i-1].x, dz=uniform[i].z-uniform[i-1].z;
  uCum.push(uCum[i-1]+Math.hypot(dx,dz));
 }

 return{points:uniform,cumLen:uCum,totalLen:uCum[uCum.length-1]};
}

// Restituisce il punto sul path alla distanza 'dist' dall'inizio
function samplePathAt(pathData,dist){
 if(!pathData.points||pathData.points.length<2)return null;
 dist=clamp(dist,0,pathData.totalLen);
 const cum=pathData.cumLen;
 let lo=0,hi=cum.length-1;
 while(lo<hi-1){
  const mid=(lo+hi)>>1;
  if(cum[mid]<dist)lo=mid;else hi=mid;
 }
 const segLen=cum[hi]-cum[lo];
 const t=segLen>1e-6?(dist-cum[lo])/segLen:0;
 const a=pathData.points[lo],b=pathData.points[hi];
 return{x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t};
}

function segmentClear(ax,az,bx,bz,r,steps){
 r=r||.5;steps=steps||10;
 for(let i=1;i<=steps;i++){const t=i/steps;if(circleHitsWalls(ax+(bx-ax)*t,az+(bz-az)*t,r))return false}
 return true;
}
function pickGoals(openCells,startC,count){
 const minD=MAZE_SIZE*CELL*.28,sep=CELL*5;
 const cands=[];
 for(let i=0;i<openCells.length;i++){
  const c=openCells[i];
  if(c.cx===1&&c.cz===1)continue;
  const p=cellCenter(c.cx,c.cz);
  if(Math.hypot(p.x-startC.x,p.z-startC.z)>minD)cands.push(c);
 }
 shuffle(cands);
 const chosen=[];
 for(let i=0;i<cands.length&&chosen.length<count;i++){
  const p=cellCenter(cands[i].cx,cands[i].cz);
  let ok=true;
  for(let j=0;j<chosen.length;j++)if(Math.hypot(p.x-chosen[j].x,p.z-chosen[j].z)<sep){ok=false;break}
  if(ok)chosen.push(p);
 }
 const fb=[[MAZE_SIZE-2,MAZE_SIZE-2],[1,MAZE_SIZE-2],[MAZE_SIZE-2,1]];
 for(let i=0;i<fb.length&&chosen.length<count;i++){
  const cx=fb[i][0],cz=fb[i][1];
  if(isOpenCell(cx,cz)){
   const p=cellCenter(cx,cz);
   let ok=true;
   for(let j=0;j<chosen.length;j++)if(Math.hypot(p.x-chosen[j].x,p.z-chosen[j].z)<CELL*3){ok=false;break}
   if(ok)chosen.push(p);
  }
 }
 if(!chosen.length){const n=nearestOpenCell(MAZE_SIZE-2,MAZE_SIZE-2);if(n)chosen.push(cellCenter(n.x,n.z))}
 return chosen.slice(0,count);
}

function resolveWalls(obj,r,iters){
 iters=iters||2;
 for(let it=0;it<iters;it++)for(let i=0;i<wallBoxes.length;i++){
  const b=wallBoxes[i];
  if(obj.x+r<b.minX||obj.x-r>b.maxX||obj.z+r<b.minZ||obj.z-r>b.maxZ)continue;
  const cx=clamp(obj.x,b.minX,b.maxX),cz=clamp(obj.z,b.minZ,b.maxZ);
  const dx=obj.x-cx,dz=obj.z-cz,d2=dx*dx+dz*dz;
  if(d2<r*r){
   if(d2<1e-8){
    const l=obj.x-b.minX,rt=b.maxX-obj.x,tp=obj.z-b.minZ,bt=b.maxZ-obj.z;
    const m=Math.min(l,rt,tp,bt);
    if(m===l)obj.x=b.minX-r;else if(m===rt)obj.x=b.maxX+r;else if(m===tp)obj.z=b.minZ-r;else obj.z=b.maxZ+r;
   }else{
    const d=Math.sqrt(d2),push=(r-d)/d;
    obj.x+=dx*push;obj.z+=dz*push;
   }
  }
 }
 const lim=(-offsetX)-CELL*.65;
 obj.x=clamp(obj.x,-lim,lim);obj.z=clamp(obj.z,-lim,lim);
}
function circleHitsWalls(x,z,r){
 for(let i=0;i<wallBoxes.length;i++){
  const b=wallBoxes[i];
  if(x+r<b.minX||x-r>b.maxX||z+r<b.minZ||z-r>b.maxZ)continue;
  const cx=clamp(x,b.minX,b.maxX),cz=clamp(z,b.minZ,b.maxZ);
  const dx=x-cx,dz=z-cz;
  if(dx*dx+dz*dz<r*r)return true;
 }
 return false;
}
function resolveObstacles(obj,r,isPlayer){
 if(obj.y>.7)return;
 inMud=false;
 for(let i=0;i<obstacles.length;i++){
  const ob=obstacles[i];
  const dx=obj.x-ob.x,dz=obj.z-ob.z,d=Math.hypot(dx,dz);
  if(ob.type==='mud'){
   if(d<ob.r+r*.5){
    inMud=true;
    if(isPlayer&&Math.hypot(velX,velZ)>2&&!ob.slowed){
     ob.slowed=true;SFX.mud();spawnParticles(obj.x,.1,obj.z,0x3d2b1a,6);
     setTimeout(function(){ob.slowed=false},800);
    }
   }
   continue;
  }
  if(ob.type==='log'){
   if(d<ob.r+r){
    if(isPlayer&&settings.autoJump&&grounded&&Math.hypot(velX,velZ)>5&&stumble<=0){
     vy=8;grounded=false;SFX.vault();spawnParticles(obj.x,.3,obj.z,0x7c5127,5);
    }else if(isPlayer&&grounded&&stumble<=0&&Math.hypot(velX,velZ)>2.5){
     stumble=1.2;velX*=.1;velZ*=.1;shake=.4;damageAlpha=Math.max(damageAlpha,.25);SFX.trip();
     spawnParticles(obj.x,.3,obj.z,0x7c5127,8);
    }
    if(d>1e-6){const push=(ob.r+r-d)/d;obj.x+=dx*push;obj.z+=dz*push}
   }
  }else if(ob.type==='rock'){
   if(d<ob.r+r){
    if(isPlayer&&Math.hypot(velX,velZ)>4&&ob.cooldown<=0){
     ob.cooldown=1;shake=.3;SFX.hit();spawnParticles(obj.x,.4,obj.z,0x6a6a72,10);
     velX*=-.3;velZ*=-.3;
    }
    if(d>1e-6){const push=(ob.r+r-d)/d;obj.x+=dx*push;obj.z+=dz*push}
   }
  }
 }
}

// Costruisce il path denso una volta sola
function computeMovePath(){
 const dx=moveTarget.x-player.x,dz=moveTarget.z-player.z,dist=Math.hypot(dx,dz);
 if(dist<CELL*1.8&&segmentClear(player.x,player.z,moveTarget.x,moveTarget.z,.5,8)){
  movePath=[{x:player.x,z:player.z},{x:moveTarget.x,z:moveTarget.z}];
 }else{
  const p=findPath(player.x,player.z,moveTarget.x,moveTarget.z);
  if(p.length){
   // Aggiungi posizione corrente come primo waypoint per continuità
   movePath=[{x:player.x,z:player.z}].concat(simplifyPath(p));
   const last=movePath[movePath.length-1];
   if(Math.hypot(last.x-moveTarget.x,last.z-moveTarget.z)>.3&&segmentClear(last.x,last.z,moveTarget.x,moveTarget.z,.5,6)){
    movePath.push({x:moveTarget.x,z:moveTarget.z});
   }
  }else{
   movePath=[{x:player.x,z:player.z},{x:moveTarget.x,z:moveTarget.z}];
  }
 }
 // Costruisci path denso e uniforme
 smoothPath=buildDensePath(movePath);
 // Imposta il cursore alla distanza iniziale (0 = inizio)
 pathCursor=0;
}

// ============ MOVIMENTO FLUIDO ============
function updatePlayer(dt){
 const kf=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
 const krKeys=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 const krJoy=krKeys*(settings.invertX?-1:1);
 let f=clamp(kf,-1,1),r=clamp(krJoy,-1,1);
 const dead=.12;
 if(Math.abs(f)<dead)f=0;
 if(Math.abs(r)<dead)r=0;
 const mag=Math.hypot(f,r);
 if(mag>1){f/=mag;r/=mag}
 const analogMag=Math.min(1,mag);
 const manual=mag>.08;

 let nearestCowDist=Infinity;
 for(let i=0;i<cows.length;i++){
  const c=cows[i],d=Math.hypot(player.x-c.x,player.z-c.z);
  if(d<nearestCowDist)nearestCowDist=d;
 }
 const autoSprint=nearestCowDist<8&&!sprintLocked&&stamina>20&&moveTargetActive;
 const wantsSprint=sprintHeld||keys.ShiftLeft||keys.ShiftRight||autoSprint;

 let dirX=0,dirZ=0,targetSpeed=0,followPath=false,cameraYawTarget=null;
 inputMoving=false;

 if(manual){
  cancelMoveTarget();
  const sin=Math.sin(viewYaw),cos=Math.cos(viewYaw);
  dirX=(sin*f+cos*r)*analogMag;
  dirZ=(cos*f-sin*r)*analogMag;
  inputMoving=true;
 }else if(moveTargetActive&&smoothPath&&smoothPath.totalLen>0.1){
  // Ricalcolo periodico se il path è molto vecchio o ci siamo allontanati troppo
  moveRepathTimer-=dt;
  if(moveRepathTimer<=0){
   computeMovePath();
   moveRepathTimer=.8;
  }

  // Avanza il cursore lungo il path in base alla velocità attuale
  const currentSpeed=Math.hypot(velX,velZ);
  // Proietta la velocità sulla direzione del path per avanzamento corretto
  const curPoint=samplePathAt(smoothPath,pathCursor);
  if(curPoint){
   const tangentSample=samplePathAt(smoothPath,pathCursor+0.3);
   if(tangentSample){
    const tdx=tangentSample.x-curPoint.x,tdz=tangentSample.z-curPoint.z;
    const tLen=Math.hypot(tdx,tdz)||1;
    const tangentX=tdx/tLen, tangentZ=tdz/tLen;
    // Componente della velocità lungo la tangente
    const projectedSpeed=velX*tangentX+velZ*tangentZ;
    // Avanza il cursore usando la proiezione (evita di andare troppo avanti/indietro)
    pathCursor+=Math.max(0,projectedSpeed)*dt;
   }else{
    pathCursor+=currentSpeed*dt;
   }
  }

  // Punto corrente sul path
  const here=samplePathAt(smoothPath,pathCursor);
  if(!here){cancelMoveTarget();return}

  // Distanza tra giocatore e punto sul path
  const errDx=player.x-here.x, errDz=player.z-here.z;
  const errDist=Math.hypot(errDx,errDz);

  // Se il giocatore si è allontanato troppo (spinto da mucca/ostacolo),
  // riallinea il cursore al punto più vicino sul path
  if(errDist>2.0){
   // Riempi cursor: cerca il punto sul path più vicino
   let best=0,bestD=Infinity;
   for(let i=0;i<smoothPath.points.length;i+=5){
    const p=smoothPath.points[i];
    const d=(player.x-p.x)**2+(player.z-p.z)**2;
    if(d<bestD){bestD=d;best=i}
   }
   pathCursor=smoothPath.cumLen[best];
  }

  // LOOK-AHEAD: mira a un punto leggermente avanti sul path
  const lookDist=LOOK_AHEAD_DIST;
  const target=samplePathAt(smoothPath,Math.min(smoothPath.totalLen,pathCursor+lookDist));
  if(!target){cancelMoveTarget();return}

  const tdx=target.x-player.x, tdz=target.z-player.z;
  const tDist=Math.hypot(tdx,tdz);

  // Fine path
  if(pathCursor>=smoothPath.totalLen-0.2&&tDist<0.5){
   cancelMoveTarget();
   return;
  }

  if(tDist>0.05){
   dirX=tdx/tDist;
   dirZ=tdz/tDist;
   inputMoving=true;
   followPath=true;
   // Camera look-ahead più lontano
   const camLook=samplePathAt(smoothPath,Math.min(smoothPath.totalLen,pathCursor+lookDist*3));
   if(camLook){
    const cdx=camLook.x-player.x,cdz=camLook.z-player.z;
    const cd=Math.hypot(cdx,cdz);
    if(cd>.1)cameraYawTarget=Math.atan2(cdx,cdz);
   }
  }
 }

 // Sprint
 if(wantsSprint&&!sprintLocked&&stamina>0&&inputMoving&&stumble<=0){
  if(!sprintActive)SFX.sprint();
  sprintActive=true;stamina-=34*dt;sprintRegenDelay=.72;
  if(stamina<=0){stamina=0;sprintLocked=true}
 }else{
  sprintActive=false;sprintRegenDelay-=dt;
  if(sprintRegenDelay<=0)stamina=Math.min(100,stamina+(grounded?23:14)*dt);
  if(sprintLocked&&stamina>30)sprintLocked=false;
 }

 let speed=stumble>0?2.2:(sprintActive?11.2:6.5);
 if(inMud)speed*=.45;

 // Riduzione velocità in curva: calcola curvatura tra heading attuale e target
 if(inputMoving){
  const targetHeading=Math.atan2(dirX,dirZ);
  const headingDiff=Math.abs(normalizeAngle(targetHeading-heading));
  // Rallenta progressivamente in base alla curvatura (max -40%)
  const curvePenalty=clamp(headingDiff/Math.PI,0,1)*.4;
  speed*=(1-curvePenalty);
 }

 const targetX=dirX*speed,targetZ=dirZ*speed;

 // Rotazione fluido dell'heading: velocità proporzionale alla differenza angolare
 if(inputMoving){
  const targetHeading=Math.atan2(dirX,dirZ);
  const diff=normalizeAngle(targetHeading-heading);
  // Più grande la differenza, più veloce la rotazione (fino a un limite)
  const rotSpeed=clamp(Math.abs(diff)*10,6,20);
  heading=dampAngle(heading,targetHeading,rotSpeed,dt);
 }

 if(followPath&&cameraYawTarget!==null){
  autoOrbitYaw=dampAngle(autoOrbitYaw,cameraYawTarget,4,dt);
 }

 // Accelerazione adattiva: più rapida quando si vuole cambiare direzione
 const turning=inputMoving&&Math.abs(normalizeAngle(Math.atan2(targetX,targetZ)-Math.atan2(velX||0.001,velZ||0.001)))>.3;
 const accel=grounded?(inputMoving?(turning?18:14):24):6;
 velX=damp(velX,targetX,accel,dt);
 velZ=damp(velZ,targetZ,accel,dt);

 jumpBuffer-=dt;
 coyote=grounded?.12:coyote-dt;
 if(jumpBuffer>0&&coyote>0&&stumble<=0){
  vy=9.8;grounded=false;jumpBuffer=0;coyote=0;SFX.jump();
 }
 if(!jumpHeld&&vy>0)vy-=26*dt;
 vy-=27*dt;
 const wasG=grounded;
 player.y+=vy*dt;
 if(player.y<=0){
  if(!wasG&&vy<-7)SFX.land();
  player.y=0;vy=0;grounded=true;
 }else grounded=false;

 player.x+=velX*dt;player.z+=velZ*dt;
 resolveWalls(player,player.r,3);
 resolveObstacles(player,player.r,true);
 stumble=Math.max(0,stumble-dt);
 invuln=Math.max(0,invuln-dt);

 playerMesh.position.set(player.x,player.y,player.z);
 playerMesh.rotation.y=heading;
 const hSpeed=Math.hypot(velX,velZ);
 runPhase+=dt*(4+hSpeed*1.5);
 const swing=Math.sin(runPhase)*Math.min(1,hSpeed/6)*(grounded?.9:.3);
 playerParts.legL.rotation.x=swing;
 playerParts.legR.rotation.x=-swing;
 playerParts.armL.rotation.x=-swing*.8;
 playerParts.armR.rotation.x=swing*.8;
 playerParts.body.position.y=1.05+Math.abs(Math.sin(runPhase))*.05*Math.min(1,hSpeed/6);
 playerParts.body.rotation.z=0;
 playerParts.head.rotation.z=0;
 if(!grounded){
  playerParts.legL.rotation.x=-.45;playerParts.legR.rotation.x=.55;
  playerParts.armL.rotation.x=-.85;playerParts.armR.rotation.x=-.35;
 }
 updateNearestGoal();
 if(goalArrow)goalArrow.visible=!!nearestGoal;
 if(nearestGoal&&nearestGoalDist<1.75)winGame();
}

function updateCows(dt){
 let closestCow=null,closestDist=Infinity;
 for(let i=0;i<cows.length;i++){
  const c=cows[i];
  const d=Math.hypot(player.x-c.x,player.z-c.z);
  c.distToPlayer=d;
  if(d<closestDist){closestDist=d;closestCow=c}
 }

 for(let ci=0;ci<cows.length;ci++){
  const cow=cows[ci];
  cow.stateTimer-=dt;
  const seesPlayer=cow.distToPlayer<cow.aggroRadius&&cow.state!=='stalk';
  const canSeePlayer=cow.distToPlayer<15&&segmentClear(cow.x,cow.z,player.x,player.z,.6,6);

  if(canSeePlayer){
   cow.lastKnownPlayerX=player.x;
   cow.lastKnownPlayerZ=player.z;
   cow.sawPlayer=true;
  }

  if(cow.stateTimer<=0){
   if(cow.personality==='stalker'&&cow.distToPlayer<30&&nearestGoal){
    cow.state='stalk';cow.stateTimer=rand(3,6);
    const goal=goals[(Math.random()*goals.length)|0];
    cow.targetX=goal.x;cow.targetZ=goal.z;
   }else if(canSeePlayer||cow.distToPlayer<cow.aggroRadius*.6){
    cow.state='chase';cow.stateTimer=rand(2,4);
   }else if(cow.sawPlayer){
    cow.state='search';cow.stateTimer=rand(3,6);
   }else{
    cow.state='patrol';cow.stateTimer=rand(4,8);
    const cells=[];
    for(let i=0;i<openCellsGlobal.length;i++){
     const c=openCellsGlobal[i],p=cellCenter(c.cx,c.cz);
     if(Math.hypot(p.x-cow.x,p.z-cow.z)<CELL*8)cells.push(p);
    }
    if(cells.length){
     const pick=cells[(Math.random()*cells.length)|0];
     cow.targetX=pick.x;cow.targetZ=pick.z;
    }
   }
  }

  let targetX,targetZ;
  switch(cow.state){
   case 'chase':targetX=player.x;targetZ=player.z;break;
   case 'stalk':
    targetX=cow.targetX;targetZ=cow.targetZ;
    if(cow.distToPlayer<10){cow.state='chase';cow.stateTimer=3}
    break;
   case 'search':
    targetX=cow.lastKnownPlayerX;targetZ=cow.lastKnownPlayerZ;
    if(Math.hypot(cow.x-targetX,cow.z-targetZ)<1.5){
     cow.state='patrol';cow.stateTimer=rand(2,4);cow.sawPlayer=false;
    }
    break;
   default:
    targetX=cow.targetX;targetZ=cow.targetZ;
    if(Math.hypot(cow.x-targetX,cow.z-targetZ)<1.5)cow.stateTimer=0;
    break;
  }

  cow.repath-=dt;
  if(cow.repath<=0||cow.path.length===0){
   cow.path=findPath(cow.x,cow.z,targetX,targetZ);
   cow.repath=.3+Math.random()*.2;
  }

  let pathTx=targetX,pathTz=targetZ;
  if(cow.path.length){
   pathTx=cow.path[0].x;pathTz=cow.path[0].z;
   if(Math.hypot(cow.x-pathTx,cow.z-pathTz)<.8)cow.path.shift();
  }

  let dx=pathTx-cow.x,dz=pathTz-cow.z,d=Math.hypot(dx,dz)||1;
  dx/=d;dz/=d;

  let speed=cow.baseSpeed;
  if(cow.state==='chase'){speed*=1.2;if(cow.distToPlayer<7)speed+=.85}
  else if(cow.state==='stalk')speed*=1.1;
  else if(cow.state==='search')speed*=.8;
  else speed*=.5;

  if(cow.stun>0){cow.stun-=dt;speed=.45}
  if(cow.blocked>0){cow.blocked-=dt;speed*=.5}

  let sepX=0,sepZ=0;
  for(let oi=0;oi<cows.length;oi++){
   if(oi===ci)continue;
   const other=cows[oi];
   const sx=cow.x-other.x,sz=cow.z-other.z;
   const sd=Math.hypot(sx,sz);
   if(sd<1.8&&sd>.001){
    const force=1/(sd*sd);
    sepX+=sx/sd*force;
    sepZ+=sz/sd*force;
   }
  }

  if(cow.personality==='chaser'&&closestCow===cow&&cow.state==='chase'&&nearestGoal){
   if(Math.random()<.005){
    const goalDir=Math.atan2(nearestGoal.x-player.x,nearestGoal.z-player.z);
    const perpAngle=goalDir+Math.PI/2;
    const interceptX=player.x+Math.cos(goalDir)*8+Math.cos(perpAngle)*4;
    const interceptZ=player.z+Math.sin(goalDir)*8+Math.sin(perpAngle)*4;
    const newPath=findPath(cow.x,cow.z,interceptX,interceptZ);
    if(newPath.length>1)cow.path=newPath;
   }
  }

  const sepMag=Math.hypot(sepX,sepZ);
  if(sepMag>.01){sepX/=sepMag;sepZ/=sepMag}
  dx=dx+sepX*.8;dz=dz+sepZ*.8;

  const dm=Math.hypot(dx,dz)||1;
  dx/=dm;dz/=dm;

  const prevX=cow.x,prevZ=cow.z;
  cow.x+=dx*speed*dt;cow.z+=dz*speed*dt;
  resolveWalls(cow,cow.r,2);

  if(Math.hypot(cow.x-prevX,cow.z-prevZ)<speed*dt*.2){
   cow.blocked=Math.min(cow.blocked+dt*2,3);
  }else{
   cow.blocked=Math.max(0,cow.blocked-dt);
  }

  cow.mesh.position.set(cow.x,0,cow.z);

  const movingSpeed=Math.hypot(cow.x-prevX,cow.z-prevZ)/dt;
  if(movingSpeed>.2){
   const targetAngle=Math.atan2(dx,dz);
   cow.mesh.rotation.y=dampAngle(cow.mesh.rotation.y,targetAngle,10,dt);
  }

  cow.anim+=dt*Math.max(.5,movingSpeed*.3);
  for(let li=0;li<cow.legs.length;li++){
   cow.legs[li].rotation.x=Math.sin(cow.anim+li*Math.PI/2)*.72*Math.min(1,movingSpeed/3);
  }

  if(cow.state==='search'){
   cow.headShake+=dt*8;
   cow.head.rotation.y=Math.sin(cow.headShake)*.3;
  }else{
   cow.head.rotation.y*=.9;
  }
  cow.head.position.y=1.1+Math.sin(cow.anim*.7)*.035;
  cow.tail.rotation.x=.7+Math.sin(cow.anim*.9)*.42;

  cow.moo-=dt;
  if(cow.moo<=0){
   if(cow.distToPlayer<34)SFX.moo(cow.distToPlayer,cow.state==='chase');
   cow.moo=cow.state==='chase'?rand(2,4):rand(4,9);
  }

  if(cow.distToPlayer<cow.r+player.r+.28&&invuln<=0&&cow.stun<=0){
   const dmg=cow.personality==='tank'?30:22;
   damagePlayer(dmg,cow);cow.stun=.55;cow.path=[];
   cow.state='chase';cow.stateTimer=3;
  }
 }
}

function updateCamera(dt){
 const hSpeed=Math.hypot(velX,velZ),moving=inputMoving||hSpeed>.55;
 let targetYaw;
 if(moving){idleTimer=0;targetYaw=moveTargetActive?autoOrbitYaw:heading}
 else{idleTimer+=dt;if(idleTimer>1.35)autoOrbitYaw+=dt*.1;targetYaw=autoOrbitYaw}
 const yawL=moveTargetActive?5:(moving?10:2.1);
 viewYaw=dampAngle(viewYaw,targetYaw,yawL,dt);
 let nearestCow=null,ncd=Infinity;
 for(let i=0;i<cows.length;i++){
  const c=cows[i],d=Math.hypot(player.x-c.x,player.z-c.z);
  if(d<ncd){ncd=d;nearestCow=c}
 }
 const danger=clamp(1-ncd/16,0,1);
 viewPitch=clamp(.42+danger*.14+Math.sin(elapsed*.18)*.03,.28,.95);
 const baseDist=5.7+danger*2+Math.sin(elapsed*.23)*.16;
 let horizontal=baseDist*Math.cos(viewPitch);
 const vertical=player.y+1.25+baseDist*Math.sin(viewPitch)+Math.sin(elapsed*.7)*.035;
 for(let d=horizontal;d>=1.2;d-=.35){
  const cx=player.x-Math.sin(viewYaw)*d,cz=player.z-Math.cos(viewYaw)*d;
  if(!circleHitsWalls(cx,cz,.42)){horizontal=d;break}
  horizontal=d;
 }
 const tx=player.x-Math.sin(viewYaw)*horizontal,tz=player.z-Math.cos(viewYaw)*horizontal,ty=vertical;
 const k=1-Math.exp(-8.5*dt);
 camera.position.x+=(tx-camera.position.x)*k;
 camera.position.y+=(ty-camera.position.y)*k;
 camera.position.z+=(tz-camera.position.z)*k;
 if(shake>0){
  camera.position.x+=(Math.random()-.5)*shake*.32;
  camera.position.y+=(Math.random()-.5)*shake*.2;
  camera.position.z+=(Math.random()-.5)*shake*.32;
 }
 let lx=player.x,lz=player.z;
 if(nearestCow&&danger>.25){
  lx+=(nearestCow.x-player.x)*.16*danger;
  lz+=(nearestCow.z-player.z)*.16*danger;
 }else if(nearestGoal&&nearestGoalDist>10){
  lx+=(nearestGoal.x-player.x)*.06;
  lz+=(nearestGoal.z-player.z)*.06;
 }
 camera.lookAt(lx,player.y+1.35,lz);
}

function drawDangerIndicator(){
 if(!settings.showDanger){dangerCanvas.style.opacity='0';return}
 const W=300,H=300,cx=150,cy=150;
 dangerCtx.clearRect(0,0,W,H);
 let anyDanger=false;
 for(let i=0;i<cows.length;i++){
  const c=cows[i];
  const dx=c.x-player.x,dz=c.z-player.z;
  const d=Math.hypot(dx,dz);
  if(d>25)continue;
  anyDanger=true;
  const worldAngle=Math.atan2(dx,dz);
  const screenAngle=worldAngle-viewYaw+Math.PI;
  const intensity=clamp(1-d/25,0,1);
  const radius=120;
  const px=cx+Math.sin(screenAngle)*radius;
  const py=cy-Math.cos(screenAngle)*radius;
  dangerCtx.save();
  dangerCtx.translate(px,py);
  dangerCtx.rotate(screenAngle);
  dangerCtx.fillStyle=`rgba(255,60,60,${intensity*.8})`;
  dangerCtx.beginPath();
  dangerCtx.moveTo(0,-12);
  dangerCtx.lineTo(8,10);
  dangerCtx.lineTo(-8,10);
  dangerCtx.closePath();
  dangerCtx.fill();
  dangerCtx.restore();
 }
 dangerCanvas.style.opacity=anyDanger?'1':'0';
}

function updateWorldFX(dt){
 for(let i=0;i<goals.length;i++){
  const g=goals[i];
  if(g.flag)g.flag.rotation.y=Math.sin(elapsed*2.6+i)*.4;
  if(g.light)g.light.intensity=3+Math.sin(elapsed*4+i)*.8;
 }
 fireflies.material.opacity=.62+Math.sin(elapsed*2)*.22;
 fireflies.rotation.y+=dt*.015;
 if(goalArrow&&goalArrow.visible&&nearestGoal){
  goalArrow.position.set(player.x,player.y+2.3+Math.sin(elapsed*4)*.12,player.z);
  goalArrow.rotation.y=Math.atan2(nearestGoal.x-player.x,nearestGoal.z-player.z);
 }
 if(targetMarker&&targetMarker.visible){
  const p=1+Math.sin(elapsed*7)*.18;
  targetMarker.scale.set(p,1,p);
 }
 damageAlpha=Math.max(0,damageAlpha-dt*1.4);
 damageEl.style.opacity=damageAlpha;
 shake=Math.max(0,shake-dt*1.8);
 updateParticles(dt);
 drawDangerIndicator();
}

function showMainMenu(){
 gameState='menu';
 menuOverlay.classList.remove('hidden');
 let lvlBtns='';
 const maxShow=Math.max(save.maxLevel,10);
 for(let i=1;i<=maxShow;i++){
  const locked=i>save.maxLevel;
  const cls=locked?'locked':(i===save.maxLevel?'current':'');
  lvlBtns+='<button class="lvlBtn '+cls+'" onclick="startLevel('+i+')">'+(locked?'🔒':i)+'</button>';
 }
 menuOverlay.innerHTML='<div class="menuCard">'+
  '<h1>🐄 Cow Escape</h1>'+
  '<p class="sub">Scappa dalle mucche in un labirinto 3D procedurale</p>'+
  '<div class="tabRow">'+
  '<button class="tabBtn active" onclick="switchTab(\'play\',this)">▶ Gioca</button>'+
  '<button class="tabBtn" onclick="switchTab(\'settings\',this)">⚙️ Opzioni</button>'+
  '<button class="tabBtn" onclick="switchTab(\'help\',this)">❓ Aiuto</button>'+
  '</div>'+
  '<div id="tab-play" class="tabContent active">'+
  '<div class="menuSection"><h3>Seleziona Livello</h3><div class="levelGrid">'+lvlBtns+'</div></div>'+
  '<button class="mBtn primary" onclick="startLevel('+save.maxLevel+')">▶ Continua da L'+save.maxLevel+'</button>'+
  '<button class="mBtn ghost" onclick="startLevel(1)">↻ Ricomincia</button>'+
  '</div>'+
  '<div id="tab-settings" class="tabContent">'+
  '<div class="settingsRow"><span>Inverti asse X</span><div class="toggle '+(settings.invertX?'on':'')+'" onclick="toggleSetting(\'invertX\',this)"></div></div>'+
  '<div class="settingsRow"><span>Auto-salto tronchi</span><div class="toggle '+(settings.autoJump?'on':'')+'" onclick="toggleSetting(\'autoJump\',this)"></div></div>'+
  '<div class="settingsRow"><span>Indicatore pericolo</span><div class="toggle '+(settings.showDanger?'on':'')+'" onclick="toggleSetting(\'showDanger\',this)"></div></div>'+
  '<div class="settingsRow"><span>Volume</span><input type="range" min="0" max="1" step=".1" value="'+settings.volume+'" style="width:100px" oninput="setVolume(this.value)"></div>'+
  '</div>'+
  '<div id="tab-help" class="tabContent">'+
  '<p style="font-size:13px;line-height:1.7;text-align:left">'+
  '🖱️ <b>Clicca/trascina</b> sul terreno per muoverti<br>'+
  '⌨️ <b>WASD/frecce</b> per muoverti direttamente<br>'+
  '⚡ <b>SHIFT</b> o pulsante per lo sprint (auto quando sei in pericolo!)<br>'+
  '⤒ <b>SPAZIO</b> per saltare (o auto-salto sui tronchi se attivo)<br>'+
  '<br><b>Tipi di mucca:</b><br>'+
  '🔴 <b>Chaser</b>: ti insegue diretta<br>'+
  '🟠 <b>Runner</b>: velocissima ma poco furba<br>'+
  '🟢 <b>Stalker</b>: cerca di anticiparti alle uscite<br>'+
  '🟣 <b>Tank</b>: lenta ma fa più danni<br>'+
  '<br>🪵 Tronchi · 🪨 Rocce · 🟤 Fango<br>'+
  '🚩 Raggiungi una bandiera per vincere!'+
  '</p></div></div>';
}
window.switchTab=function(id,btn){
 const tabs=document.querySelectorAll('.tabContent');
 for(let i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
 const btns=document.querySelectorAll('.tabBtn');
 for(let i=0;i<btns.length;i++)btns[i].classList.remove('active');
 document.getElementById('tab-'+id).classList.add('active');
 btn.classList.add('active');
};
window.toggleSetting=function(key,el){
 settings[key]=!settings[key];
 if(settings[key])el.classList.add('on');else el.classList.remove('on');
 persistSave();
};
window.setVolume=function(v){
 settings.volume=parseFloat(v);
 SFX.setVol(settings.volume);
 persistSave();
};
function showPauseMenu(){
 menuOverlay.classList.remove('hidden');
 menuOverlay.innerHTML='<div class="menuCard"><h1>⏸ Pausa</h1>'+
  '<p class="sub">Livello '+level+' · '+elapsed.toFixed(0)+'s</p>'+
  '<button class="mBtn primary" onclick="resumeGame()">▶ Riprendi</button>'+
  '<button class="mBtn ghost" onclick="showMainMenu()">🏠 Menu</button></div>';
}
window.resumeGame=function(){gameState='playing';menuOverlay.classList.add('hidden')};
window.showMainMenu=showMainMenu;
function showWinScreen(){
 const unlocked=level+1;
 if(unlocked>save.maxLevel){save.maxLevel=unlocked;persistSave()}
 menuOverlay.classList.remove('hidden');
 menuOverlay.innerHTML='<div class="menuCard"><h1>🏆 Livello '+level+' completato!</h1>'+
  '<p class="sub">Tempo: '+elapsed.toFixed(1)+'s · Uscite: '+goals.length+' · Mucche: '+cows.length+'</p>'+
  '<p style="font-size:13px;opacity:.7;margin-bottom:12px">💾 Sbloccato livello '+save.maxLevel+'</p>'+
  '<button class="mBtn primary" onclick="startLevel('+(level+1)+')">▶ Livello '+(level+1)+'</button>'+
  '<button class="mBtn ghost" onclick="showMainMenu()">🏠 Menu</button></div>';
}
function showLoseScreen(){
 menuOverlay.classList.remove('hidden');
 menuOverlay.innerHTML='<div class="menuCard"><h1>💀 Preso!</h1>'+
  '<p class="sub">Sopravvissuto '+elapsed.toFixed(1)+'s al livello '+level+'</p>'+
  '<button class="mBtn primary" onclick="startLevel('+level+')">↻ Riprova</button>'+
  '<button class="mBtn ghost" onclick="showMainMenu()">🏠 Menu</button></div>';
}
window.startLevel=function(l){
 level=l;
 MAZE_SIZE=Math.min(23,15+level*2);
 hp=100;stamina=100;
 sprintLocked=false;sprintActive=false;sprintHeld=false;sprintRegenDelay=0;
 stumble=0;invuln=0;elapsed=0;damageAlpha=0;shake=0;
 jumpBuffer=0;coyote=0;viewPitch=.46;
 if(!playerMesh){const p=createPlayerMesh();playerMesh=p.mesh;playerParts=p.parts;scene.add(playerMesh)}
 if(!goalArrow)goalArrow=createGoalArrow();
 if(!targetMarker)targetMarker=createTargetMarker();
 buildWorld();
 const h=5.8*Math.cos(viewPitch);
 camera.position.set(player.x-Math.sin(viewYaw)*h,player.y+1.25+5.8*Math.sin(viewPitch),player.z-Math.cos(viewYaw)*h);
 menuOverlay.classList.add('hidden');
 gameState='playing';
 SFX.init();
};
function winGame(){if(gameState!=='playing')return;gameState='win';SFX.win();showWinScreen()}
function loseGame(){if(gameState!=='playing')return;gameState='lose';SFX.lose();showLoseScreen()}

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(.033,(now-last)/1000||.016);
 last=now;
 if(gameState==='playing'){
  elapsed+=dt;
  updatePlayer(dt);updateCows(dt);updateCamera(dt);updateWorldFX(dt);
  drawMinimap();updateHUD();
 }else if(gameState==='menu'){
  const t=now*.0002;
  camera.position.set(Math.sin(t)*20,12,Math.cos(t)*20);
  camera.lookAt(0,2,0);
 }
 renderer.render(scene,camera);
}
showMainMenu();
animate(performance.now());
window.addEventListener('resize',function(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
