<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LUMEN</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#020a12;touch-action:none}
  body{font-family:'Unbounded',sans-serif;color:#eafcff;
       -webkit-user-select:none;user-select:none;
       -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}

  #hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;
       display:flex;justify-content:space-between;align-items:flex-start;
       pointer-events:none;z-index:10}
  #hud.hidden{display:none}
  .hudlbl{font-size:9px;letter-spacing:2px;opacity:.5;margin-bottom:2px}
  #score{font-size:28px;font-weight:900;text-shadow:0 0 10px rgba(95,245,227,.8)}
  #lightWrap{margin-top:6px;width:100px}
  #lightBar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
  #lightFill{height:100%;width:66%;border-radius:3px;
             background:linear-gradient(90deg,#ff6fb5,#5ff5e3,#ffd166)}
  .hudright{text-align:right}
  #depth{font-size:24px;font-weight:700;text-shadow:0 0 10px rgba(127,212,255,.5)}
  #zoneName{font-size:8px;letter-spacing:2px;color:#ffd166;margin-top:2px}

  #combo{position:fixed;top:15%;left:50%;transform:translateX(-50%);
         font-size:32px;font-weight:900;color:#ffd166;
         text-shadow:0 0 14px rgba(255,209,102,.8);pointer-events:none;opacity:0;z-index:10}
  #combo.show{opacity:1;animation:pop .4s}
  @keyframes pop{0%{transform:translateX(-50%) scale(1.5);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

  #banner{position:fixed;top:35%;left:0;right:0;text-align:center;
          font-size:clamp(16px,5vw,28px);font-weight:900;letter-spacing:4px;
          text-shadow:0 0 20px rgba(95,245,227,.7);pointer-events:none;opacity:0;z-index:12}
  #banner.show{animation:ban 3s ease forwards}
  @keyframes ban{0%{opacity:0;letter-spacing:12px}20%{opacity:1;letter-spacing:6px}80%{opacity:1}100%{opacity:0}}

  #sysBtns{position:fixed;bottom:16px;right:16px;display:flex;gap:8px;z-index:40}
  .sbtn{width:44px;height:44px;border-radius:10px;font-size:18px;cursor:pointer;
        color:#eafcff;background:rgba(4,20,30,.6);border:1px solid rgba(95,245,227,.3);
        display:grid;place-items:center}

  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;
           background:radial-gradient(ellipse at 50% 40%,rgba(3,22,34,.4),rgba(1,5,9,.9));
           padding:20px;z-index:30}
  .overlay.hidden{display:none}
  
  h1.title{font-size:clamp(48px,15vw,120px);font-weight:900;letter-spacing:4px;
           line-height:1;margin-bottom:16px;
           text-shadow:0 0 20px rgba(95,245,227,.9),0 0 60px rgba(95,245,227,.4)}
  .sub{font-size:clamp(12px,2.5vw,16px);opacity:.7;margin-bottom:32px;max-width:400px;line-height:1.5}
  
  .btn{font-size:clamp(16px,4vw,20px);font-weight:700;letter-spacing:2px;
       padding:18px 48px;border-radius:14px;cursor:pointer;
       background:linear-gradient(135deg,rgba(95,245,227,.2),rgba(255,111,181,.15));
       border:2px solid rgba(95,245,227,.8);color:#eafcff;
       box-shadow:0 0 30px rgba(95,245,227,.3);
       animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 50px rgba(95,245,227,.6)}}
  .btn:active{transform:scale(.95)}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
         margin:24px 0;width:100%;max-width:340px}
  .stat{border:1px solid rgba(95,245,227,.2);border-radius:12px;padding:14px 10px;
        background:rgba(4,20,30,.5)}
  .stat .v{font-size:24px;font-weight:700;color:#5ff5e3;text-shadow:0 0 10px rgba(95,245,227,.5)}
  .stat .k{font-size:9px;letter-spacing:2px;opacity:.5;margin-top:4px}
  
  #newRecord{display:none;background:#ffd166;color:#031018;padding:6px 16px;
             border-radius:20px;font-size:11px;font-weight:700;letter-spacing:2px;
             margin-bottom:16px;box-shadow:0 0 20px rgba(255,209,102,.6)}
  
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn.ghost{animation:none;background:transparent;border-color:rgba(234,252,255,.3);
             box-shadow:none;font-size:14px;padding:14px 32px}

  #pausedOv{position:fixed;inset:0;display:grid;place-items:center;
            background:rgba(1,5,9,.7);z-index:35}
  #pausedOv.hidden{display:none}
  #pausedOv div{font-size:32px;font-weight:900;letter-spacing:6px;
                text-shadow:0 0 20px rgba(95,245,227,.7)}

  @media(max-width:500px){
    #score{font-size:22px}#depth{font-size:20px}#lightWrap{width:80px}
    .sub{font-size:11px;margin-bottom:24px}
    .btn{padding:16px 40px}
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>

<div id="hud" class="hidden">
  <div>
    <div class="hudlbl">LUMEN</div>
    <div id="score">0</div>
    <div id="lightWrap">
      <div id="lightBar"><div id="lightFill"></div></div>
      <div class="hudlbl" style="margin-top:2px">LIGHT</div>
    </div>
  </div>
  <div class="hudright">
    <div class="hudlbl">DEPTH</div>
    <div id="depth">0m</div>
    <div id="zoneName">SURFACE</div>
  </div>
</div>

<div id="combo"></div>
<div id="banner"></div>

<div id="sysBtns">
  <button class="sbtn" id="muteBtn">🔊</button>
  <button class="sbtn" id="pauseBtn">⏸</button>
</div>

<div id="menu" class="overlay">
  <h1 class="title">LUMEN</h1>
  <div class="sub">You are a jellyfish. Your light is your life. Collect it. Don't fade away.</div>
  <button class="btn" id="startBtn">DIVE IN</button>
</div>

<div id="over" class="overlay hidden">
  <div id="newRecord">★ NEW RECORD ★</div>
  <div class="stats">
    <div class="stat"><div class="v" id="stDepth">0m</div><div class="k">DEPTH</div></div>
    <div class="stat"><div class="v" id="stScore">0</div><div class="k">LUMEN</div></div>
    <div class="stat"><div class="v" id="stCombo">×1</div><div class="k">COMBO</div></div>
    <div class="stat"><div class="v" id="stBest">0</div><div class="k">BEST</div></div>
  </div>
  <div class="btnrow">
    <button class="btn" id="retryBtn">RETRY</button>
    <button class="btn ghost" id="menuBtn">MENU</button>
  </div>
</div>

<div id="pausedOv" class="hidden"><div>PAUSED</div></div>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);

const canvas=$('sea'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

function makeGlow(rgb){const s=128,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(.25,`rgba(${rgb},.8)`);
  gr.addColorStop(.6,`rgba(${rgb},.25)`);gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=gr;g.fillRect(0,0,s,s);return c;}
const GLOW={cyan:makeGlow('95,245,227'),gold:makeGlow('255,209,102'),pink:makeGlow('255,111,181'),
            shield:makeGlow('127,212,255'),lure:makeGlow('214,255,158'),red:makeGlow('255,80,90')};

let actx=null,master=null,muted=false;
function initAudio(){
  if(actx){actx.resume&&actx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  actx=new AC();master=actx.createGain();master.gain.value=.5;master.connect(actx.destination);
}
function tone(f,dur,vol=.15){
  if(!actx||muted)return;const t0=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.01);
  g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);
}
const sCollect=()=>{tone(660,.2);tone(880,.15,.1);};
const sHit=()=>{tone(100,.3,.3);};
const sBell=()=>{tone(587,.6,.12);};

const ZONES=[[0,'SURFACE'],[200,'TWILIGHT'],[450,'MIDNIGHT'],[750,'SILENCE'],[1100,'ABYSS']];
const S={state:'menu',t:0,depth:0,score:0,shake:0,zoneIdx:0,paused:false,dieT:0,
         maxCombo:0,collected:0,tUrchin:3};
const P={x:0,y:0,vx:0,vy:0,r:16,light:100,maxLight:150,thrust:false,ph:0,
         invuln:0,shield:0,combo:0,comboT:0,trail:[]};
let motes=[],urchins=[],parts=[],floats=[],bubbles=[];

let pointer={x:W/2,y:H/3,down:false};
let best=JSON.parse(localStorage.getItem('lumen.best')||'null')||{d:0,s:0};

function spawnMote(){
  let x=rand(30,W-30),y=rand(30,H-30);
  let type='mote';const r=Math.random();
  if(S.depth>150&&r<.06)type='gold';else if(r>.98&&P.shield<=0)type='shield';
  motes.push({x,y,bx:x,by:y,r:type==='gold'?6:type==='shield'?7:rand(3,4.5),
    type,ph:rand(0,TAU),t:rand(0,9)});
}
function spawnUrchin(){
  const r=rand(14,22);
  urchins.push({x:rand(40,W-40),y:H+r+30,r,vy:-rand(25,45),vx:rand(-10,10),
    rot:rand(0,TAU),vr:rand(-.8,.8),n:8+Math.floor(rand(0,4))});
}
function burst(x,y,n,spr,spd){
  for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(.3,1)*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(4,10),
      life:rand(.4,.8),t:0,spr});}
  if(parts.length>300)parts.splice(0,parts.length-300);
}
function addFloat(x,y,txt,color){floats.push({x,y,txt,color,t:0,life:1});}
function banner(txt){const b=$('banner');b.textContent=txt;
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}

function hit(dmg,sx,sy){
  if(P.invuln>0)return;
  if(P.shield>0){P.shield=0;P.invuln=.8;
    burst(P.x,P.y,20,GLOW.shield,200);addFloat(P.x,P.y-30,'SHIELD!','#7fd4ff');return;}
  P.light-=dmg;P.invuln=1.2;S.shake=12;P.combo=0;sHit();
  const a=Math.atan2(P.y-sy,P.x-sx);P.vx+=Math.cos(a)*350;P.vy+=Math.sin(a)*350;
  burst(P.x,P.y,15,GLOW.red,220);addFloat(P.x,P.y-26,'-'+dmg,'#ff5a6e');
  if(P.light<=0){P.light=0;die();}
}
function die(){S.state='dying';S.dieT=0;burst(P.x,P.y,50,GLOW.cyan,300);}
function collect(m,i){
  motes.splice(i,1);
  if(m.type==='shield'){P.shield=8;burst(m.x,m.y,18,GLOW.shield,160);
    addFloat(m.x,m.y,'SHIELD!','#7fd4ff');return;}
  if(m.type==='gold'){S.score+=25;S.collected++;
    burst(m.x,m.y,28,GLOW.gold,240);addFloat(m.x,m.y,'+25','#ffd166');return;}
  const val=Math.round(4*(1+Math.min(P.combo,10)*.2));
  P.combo++;P.comboT=2.4;S.maxCombo=Math.max(S.maxCombo,P.combo);
  S.score+=val;S.collected++;P.light=Math.min(P.maxLight,P.light+val);
  burst(m.x,m.y,8,GLOW.cyan,140);addFloat(m.x,m.y,'+'+val,'#aefcf2');
  sCollect();
  const c=$('combo');
  if(P.combo>=2){c.textContent='×'+P.combo;c.classList.remove('show');
    void c.offsetWidth;c.classList.add('show');}
}

function updatePlayer(dt){
  const tx=pointer.x,ty=pointer.y,thrust=pointer.down;
  const dx=tx-P.x,dy=ty-P.y,d=Math.hypot(dx,dy)||1;
  const acc=thrust?900:100;
  P.vx+=dx/d*acc*dt;P.vy+=dy/d*acc*dt;
  if(!thrust)P.vy+=25*dt;
  const damp=Math.exp(-(thrust?1.8:.9)*dt);P.vx*=damp;P.vy*=damp;
  const sp=Math.hypot(P.vx,P.vy),maxs=thrust?480:180;
  if(sp>maxs){P.vx*=maxs/sp;P.vy*=maxs/sp;}
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  P.x=clamp(P.x,20,W-20);P.y=clamp(P.y,20,H-20);
  P.trail.unshift({x:P.x,y:P.y});if(P.trail.length>22)P.trail.pop();
  P.ph+=dt*(thrust?8:2.2);P.r=14+P.light*.05;
  P.invuln=Math.max(0,P.invuln-dt);
  P.shield=Math.max(0,P.shield-dt);
  P.comboT-=dt;if(P.comboT<=0){P.combo=0;$('combo').classList.remove('show');}
  if(thrust&&!P.thrust){
    for(let i=0;i<2;i++)bubbles.push({x:P.x+rand(-6,6),y:P.y+rand(-4,8),
      r:rand(1.5,3.5),vy:-rand(45,90)});}
  P.thrust=thrust;
}

function updatePlay(dt){
  S.depth+=dt*(P.thrust?14:7);
  while(S.zoneIdx+1<ZONES.length&&S.depth>=ZONES[S.zoneIdx+1][0]){
    S.zoneIdx++;banner(ZONES[S.zoneIdx][1]);sBell();
    $('zoneName').textContent=ZONES[S.zoneIdx][1];}
  if(S.depth>300)P.light-=dt*Math.min(2,.5+(S.depth-300)/600);
  if(P.light<=0){P.light=0;die();return;}
  const target=10+Math.min(12,S.depth/80);
  while(motes.length<target)spawnMote();
  for(let i=motes.length-1;i>=0;i--){const m=motes[i];m.t+=dt;
    m.x=m.bx+Math.sin(m.t*.7+m.ph)*12;m.y=m.by+Math.cos(m.t*.5+m.ph)*10;
    if(Math.hypot(P.x-m.x,P.y-m.y)<P.r+m.r+8)collect(m,i);}
  if(S.depth>50){S.tUrchin-=dt;
    if(S.tUrchin<=0){spawnUrchin();S.tUrchin=clamp(3.2-S.depth*.0015,1.2,3.2)*rand(.8,1.2);}}
  for(let i=urchins.length-1;i>=0;i--){const u=urchins[i];
    u.y+=u.vy*dt;u.x+=u.vx*dt;u.rot+=u.vr*dt;
    if(u.y<-u.r-40){urchins.splice(i,1);continue;}
    if(Math.hypot(P.x-u.x,P.y-u.y)<P.r+u.r*.85)hit(18,u.x,u.y);}
}

function updateAmbient(dt,scroll){
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];
    b.y+=(b.vy-scroll*.5)*dt;b.x+=Math.sin(S.t*2.5+b.ph||0)*12*dt;
    if(b.y<-12)bubbles.splice(i,1);}
  if(Math.random()<dt*1.2)bubbles.push({x:rand(0,W),y:H+10,r:rand(1,2.8),
    vy:-rand(35,75),ph:rand(0,TAU)});
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy=p.vy*.95-18*dt;}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.y-=32*dt;
    if(f.t>f.life)floats.splice(i,1);}
  S.shake=Math.max(0,S.shake-dt*32);
}

function drawMote(m){const spr=m.type==='gold'?GLOW.gold:m.type==='shield'?GLOW.shield:GLOW.cyan;
  const tw=.65+.35*Math.sin(S.t*2.8+m.ph);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=tw;
  ctx.drawImage(spr,m.x-m.r*4,m.y-m.r*4,m.r*8,m.r*8);
  ctx.globalAlpha=1;ctx.fillStyle='#eafffb';
  ctx.beginPath();ctx.arc(m.x,m.y,m.r*.75,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='source-over';}
function drawUrchin(u){ctx.save();ctx.translate(u.x,u.y);ctx.rotate(u.rot);
  ctx.strokeStyle='rgba(16,26,40,.9)';ctx.lineWidth=2.2;
  for(let i=0;i<u.n;i++){const a=i/u.n*TAU;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*u.r*.4,Math.sin(a)*u.r*.4);
    ctx.lineTo(Math.cos(a)*u.r,Math.sin(a)*u.r);ctx.stroke();}
  ctx.fillStyle='#0a1420';ctx.beginPath();ctx.arc(0,0,u.r*.55,0,TAU);ctx.fill();
  ctx.restore();}
function drawJelly(){
  if(S.state==='dying'&&S.dieT>.1)return;
  ctx.lineCap='round';
  for(let i=0;i<5;i++){const bx=(i-2)*P.r*.28;
    ctx.strokeStyle='rgba(150,245,235,.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(P.x+bx,P.y+P.r*.45);
    for(let j=1;j<=5;j++){const tp=P.trail[Math.min(j*3,P.trail.length-1)];
      const ox=Math.sin(S.t*2+i*1.5+j*.5)*(2+j*1.4);
      const base=tp?tp.x:P.x,baseY=tp?tp.y+j*5:P.y+j*7;
      ctx.lineTo(base+bx*.4+ox,baseY+j*1.5);}
    ctx.stroke();}
  ctx.globalCompositeOperation='lighter';
  const gr=(120+P.light*1.5);ctx.globalAlpha=.4;
  ctx.drawImage(GLOW.cyan,P.x-gr/2,P.y-gr/2,gr,gr);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.save();ctx.translate(P.x,P.y);
  if(P.invuln>0)ctx.globalAlpha=.5+.5*(Math.sin(S.t*28)>0?1:.3);
  const sx=1+.08*Math.sin(P.ph),sy=1-.07*Math.sin(P.ph);
  ctx.scale(sx,sy);const r=P.r;
  const g=ctx.createRadialGradient(0,-r*.3,r*.1,0,0,r*1.1);
  g.addColorStop(0,'rgba(232,255,252,.9)');g.addColorStop(.5,'rgba(140,246,234,.5)');
  g.addColorStop(.85,'rgba(255,111,181,.25)');g.addColorStop(1,'rgba(255,111,181,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,r,r*.9,0,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(190,255,247,.5)';ctx.lineWidth=1.3;ctx.stroke();
  const ey=-r*.1,ex=r*.3,er=r*.14;
  ctx.fillStyle='rgba(6,20,28,.85)';
  ctx.beginPath();ctx.arc(-ex,ey,er,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(ex,ey,er,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(-ex+er*.3,ey-er*.3,er*.25,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(ex+er*.3,ey-er*.3,er*.25,0,TAU);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
  if(P.shield>0){ctx.strokeStyle=`rgba(127,212,255,${.45+.25*Math.sin(S.t*4)})`;
    ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(P.x,P.y,P.r*2,0,TAU);ctx.stroke();}
}

function render(){
  const d=clamp(S.depth/1500,0,1);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,`rgb(${lerp(11,1,d)|0},${lerp(77,8,d)|0},${lerp(99,18,d)|0})`);
  bg.addColorStop(1,`rgb(${lerp(3,0,d)|0},${lerp(32,3,d)|0},${lerp(48,9,d)|0})`);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(S.shake>0)ctx.translate(rand(-1,1)*S.shake,rand(-1,1)*S.shake);
  for(const u of urchins)drawUrchin(u);
  for(const m of motes)drawMote(m);
  for(const b of bubbles){ctx.strokeStyle='rgba(190,235,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.stroke();}
  if(S.state!=='over')drawJelly();
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){const k=1-p.t/p.life;ctx.globalAlpha=k*.8;
    ctx.drawImage(p.spr,p.x-p.r*(2-k),p.y-p.r*(2-k),p.r*2*(2-k),p.r*2*(2-k));}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center';
  for(const f of floats){const k=1-f.t/f.life;ctx.globalAlpha=k;
    ctx.font='700 12px Unbounded,sans-serif';ctx.fillStyle=f.color;
    ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35+P.light,W/2,H/2,Math.max(W,H)*.7);
  vg.addColorStop(0,'rgba(0,3,8,0)');vg.addColorStop(1,`rgba(0,3,8,${.45+clamp(1-P.light/50,0,1)*.3})`);
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function hud(){
  $('score').textContent=S.score;
  $('lightFill').style.width=(P.light/P.maxLight*100)+'%';
  $('depth').textContent=Math.floor(S.depth)+'m';
}
function startGame(){
  initAudio();S.state='play';S.depth=0;S.score=0;S.zoneIdx=0;S.maxCombo=0;
  S.collected=0;S.shake=0;S.tUrchin=3;
  motes=[];urchins=[];parts=[];floats=[];
  Object.assign(P,{x:W/2,y:H*.4,vx:0,vy:0,light:100,shield:0,combo:0,invuln:1,trail:[],ph:0});
  for(let i=0;i<10;i++)spawnMote();
  $('menu').classList.add('hidden');$('over').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('zoneName').textContent=ZONES[0][1];banner(ZONES[0][1]);sBell();
}
function showMenu(){
  S.state='menu';motes=[];urchins=[];
  Object.assign(P,{x:W/2,y:H*.45,vx:0,vy:0,light:100,shield:0,combo:0,invuln:0,trail:[]});
  for(let i=0;i<10;i++)spawnMote();
  $('menu').classList.remove('hidden');$('over').classList.add('hidden');$('hud').classList.add('hidden');
}
function showOver(){
  S.state='over';const nb=S.score>best.s;
  if(nb){best={d:Math.floor(S.depth),s:S.score};localStorage.setItem('lumen.best',JSON.stringify(best));}
  $('stDepth').textContent=Math.floor(S.depth)+'m';$('stScore').textContent=S.score;
  $('stCombo').textContent='×'+S.maxCombo;$('stBest').textContent=best.s;
  $('newRecord').style.display=nb?'block':'none';
  $('over').classList.remove('hidden');$('hud').classList.add('hidden');
}
function togglePause(){
  if(S.state!=='play')return;S.paused=!S.paused;
  $('pausedOv').classList.toggle('hidden',!S.paused);
  if(actx)S.paused?actx.suspend():actx.resume();
}
function toggleMute(){muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';}

addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;});
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;initAudio();
  pointer.x=e.clientX;pointer.y=e.clientY;pointer.down=true;});
addEventListener('pointerup',()=>pointer.down=false);
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{initAudio();
  if(e.code==='Space'){e.preventDefault();if(S.state==='menu'||S.state==='over')startGame();
    else pointer.down=true;}
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  if(e.code==='KeyM')toggleMute();});
addEventListener('keyup',e=>{if(e.code==='Space')pointer.down=false;});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&S.state==='play'&&!S.paused)togglePause();});
$('startBtn').onclick=startGame;$('retryBtn').onclick=startGame;
$('menuBtn').onclick=showMenu;$('pauseBtn').onclick=togglePause;
$('muteBtn').onclick=()=>{initAudio();toggleMute();};

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);let dt=Math.min(.033,(now-last)/1000);last=now;
  if(S.paused)return;S.t+=dt;
  if(S.state==='play'||S.state==='menu')updatePlayer(dt);
  if(S.state==='play')updatePlay(dt);
  if(S.state==='dying'){S.dieT+=dt;if(S.dieT>1.2)showOver();}
  const scroll=S.state==='play'?(P.thrust?80:40):10;
  updateAmbient(dt,scroll);render();if(S.state==='play')hud();
}
showMenu();requestAnimationFrame(loop);
})();
</script>
</body>
